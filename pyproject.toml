[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-ai-pipeline"
version = "0.1.0"
description = "Stateful Gemini/DeepSeek pipeline for producing YouTube scripts"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "google-genai>=1.0.0",
  "openai>=1.30.0",
  "python-dotenv>=1.0.0",
  "google-api-python-client>=2.198,<3",
  "google-auth-oauthlib>=1.4,<2",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
youtube-pipeline = "youtube_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["youtube_pipeline*"]

